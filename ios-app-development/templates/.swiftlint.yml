disabled_rules:
  - todo
  - trailing_whitespace
  - identifier_name
  - type_name

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - unneeded_parentheses_in_closure_argument

excluded:
  - DerivedData
  - Core/.build
  - artifacts

line_length:
  warning: 140
  error: 200

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100
