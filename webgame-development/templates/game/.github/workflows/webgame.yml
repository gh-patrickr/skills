name: webgame

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: webgame-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WG_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify (lint → unit → build → e2e → bots → perf)
        run: node tools/wg.mjs verify

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgame-evidence
          path: |
            artifacts/
          retention-days: 14
