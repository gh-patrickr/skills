<!--
  SolidCraft model viewer - one self-contained, offline HTML file (three.js is inlined).

  To show a model, do ONE of these (highest priority first):
    1. Embed it (works everywhere, incl. file:// and Antigravity artifacts):
         python3 scripts/sc_view.py model.sc|model.glb|model.stl -o model.html
    2. Reference it: set "model" in the sc-config block below to a relative/absolute URL
       of a .glb/.gltf/.stl and serve the folder over http (python3 -m http.server).
    3. URL parameter: solidcraft-viewer.html?model=parts/bracket.glb&view=front
    4. Drag a .glb/.stl onto the page, or press "Open".
-->

<style>

<div class="sc-root" id="sc-root" tabindex="0" aria-label="Interactive 3D model viewer">
  <div class="sc-bar tl" role="toolbar" aria-label="Display">
    <button class="sc-btn" data-act="fit" title="Fit model to view (F)">Fit</button>
    <button class="sc-btn" data-toggle="edges" title="Feature edges (E)">Edges</button>
    <button class="sc-btn" data-toggle="wireframe" title="Wireframe (W)">Wire</button>
    <button class="sc-btn" data-toggle="ground" title="Grid and shadow (G)">Ground</button>
    <button class="sc-btn" data-toggle="ortho" title="Orthographic camera (O)">Ortho</button>
    <button class="sc-btn" data-toggle="autoRotate" title="Auto-rotate (R)">Spin</button>
    <button class="sc-btn" data-act="section" title="Section plane (S)">Section</button>
    <button class="sc-btn" data-act="parts" title="Parts list (P)">Parts</button>
    <button class="sc-btn" data-act="open" title="Open a .glb / .stl file">Open</button>
    <button class="sc-btn" data-act="shot" title="Save PNG screenshot">PNG</button>
    <button class="sc-btn" data-act="fullscreen" title="Fullscreen">⛶</button>
  </div>
  <div class="sc-bar br" role="toolbar" aria-label="Standard views">
    <button class="sc-btn" data-view="iso" title="Isometric (1)">Iso</button>
    <button class="sc-btn" data-view="front" title="Front, from -Y (2)">Front</button>
    <button class="sc-btn" data-view="top" title="Top, from +Z (3)">Top</button>
    <button class="sc-btn" data-view="right" title="Right, from +X (4)">Right</button>
  </div>
  <div class="sc-panel" id="sc-parts" hidden><h4>Parts</h4><div id="sc-parts-list"></div></div>
  <div class="sc-panel" id="sc-section" hidden>
    <h4>Section plane</h4>
    <div class="sc-row">
      <button class="sc-btn" data-axis="x">X</button><button class="sc-btn" data-axis="y">Y</button><button class="sc-btn" data-axis="z">Z</button>
      <button class="sc-btn" data-act="flip" title="Keep the other side">Flip</button>
    </div>
    <input type="range" id="sc-section-pos" min="0" max="1000" value="500" aria-label="Section position">
    <div class="sc-dims" id="sc-section-label"></div>
  </div>
  <div class="sc-info"><div class="sc-title" id="sc-title"></div><div class="sc-dims" id="sc-dims"></div></div>
  <div class="sc-hint" id="sc-hint">Drag: rotate · Scroll/pinch: zoom · Right-drag/Shift: pan</div>
  <div class="sc-overlay" id="sc-overlay"><div class="sc-msg" id="sc-msg">Loading viewer…</div></div>
