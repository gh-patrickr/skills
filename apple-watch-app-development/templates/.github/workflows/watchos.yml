name: watchOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: watchos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pin this image (macos-15 / macos-26) once the project is real: simulator runtimes differ.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TZ: UTC
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen xcbeautify swiftlint

      - name: Show toolchain
        run: bash scripts/apple/preflight.sh --platform watchos || true

      - name: Verify
        run: bash scripts/apple/verify.sh --platform watchos --coverage-min 0.6

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: artifacts/
          retention-days: 14
